<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎵 ダウンロード申請</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header>
    <h1>🎵 音楽ダウンロード申請</h1>
    <p class="sub">まとめて貼り付けて一括ダウンロード</p>
  </header>

  <!-- モード切り替えタブ -->
  <div class="tabs" role="tablist">
    <button class="tab active" data-mode="csv" role="tab">📝 楽曲リスト</button>
    <button class="tab" data-mode="playlist" role="tab">🎵 プレイリスト</button>
  </div>

  <form id="form">
    <input type="hidden" name="mode" id="modeInput" value="csv">

    <!-- CSV モード説明 -->
    <div class="hint" id="hint-csv">
      <strong>書式（1行1曲）:</strong><br>
      <code>アーティスト,曲名</code><br>
      <code>アーティスト,曲名,URL</code><br>
      <code>URL のみ</code> ／ <code>曲名のみ</code> も可<br>
      <span class="muted"># で始まる行はコメント。曲名にカンマを含む場合は "..." で囲む。</span>
    </div>

    <!-- プレイリストモード説明 -->
    <div class="hint hidden" id="hint-playlist">
      <strong>書式（1行1URL）:</strong><br>
      <code>https://www.youtube.com/playlist?list=...</code><br>
      <span class="muted"># で始まる行はコメント。</span>
    </div>

    <label for="body">入力内容</label>
    <textarea id="body" name="body" rows="12"
      placeholder="Queen,Bohemian Rhapsody&#10;サカナクション,新宝島&#10;https://youtu.be/fJ9rUzIMcZQ"
      autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>

    <div class="counter"><span id="lineCount">0</span> 行</div>

    <button type="submit" id="btn">申請する</button>
  </form>

  <div id="result"></div>

  <section id="status-box" class="hidden">
    <h2>処理状況</h2>
    <div id="status-line">待機中...</div>
    <pre id="status-log"></pre>
  </section>

  <footer>
    <p>PC: <a href="http://127.0.0.1:5000" target="_blank">http://127.0.0.1:5000</a></p>
    <p>スマホ: <code>http://{{ local_ip }}:5000</code></p>
  </footer>
</main>

<script>
const form      = document.getElementById("form");
const btn       = document.getElementById("btn");
const bodyEl    = document.getElementById("body");
const modeInput = document.getElementById("modeInput");
const tabs      = document.querySelectorAll(".tab");
const hintCsv   = document.getElementById("hint-csv");
const hintPl    = document.getElementById("hint-playlist");
const result    = document.getElementById("result");
const statusBox = document.getElementById("status-box");
const statusLine = document.getElementById("status-line");
const statusLog  = document.getElementById("status-log");
const lineCount  = document.getElementById("lineCount");

let pollTimer = null;

// --- タブ切り替え ---
tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const mode = tab.dataset.mode;
    modeInput.value = mode;

    if (mode === "csv") {
      hintCsv.classList.remove("hidden");
      hintPl.classList.add("hidden");
      bodyEl.placeholder = "Queen,Bohemian Rhapsody\nサカナクション,新宝島\nhttps://youtu.be/fJ9rUzIMcZQ";
    } else {
      hintCsv.classList.add("hidden");
      hintPl.classList.remove("hidden");
      bodyEl.placeholder = "https://www.youtube.com/playlist?list=PLxxxxxxxx";
    }
    updateLineCount();
  });
});

// --- 行数カウント ---
function updateLineCount() {
  const lines = bodyEl.value
    .split("\n")
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("#"));
  lineCount.textContent = lines.length;
}
bodyEl.addEventListener("input", updateLineCount);

// --- 送信 ---
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!bodyEl.value.trim()) {
    result.textContent = "❌ 入力が空です";
    result.className = "ng";
    return;
  }

  btn.disabled = true;
  btn.textContent = "送信中...";
  result.textContent = "";
  result.className = "";

  try {
    const fd = new FormData(form);
    const res = await fetch("/submit", { method: "POST", body: fd });
    const data = await res.json();

    if (data.ok) {
      result.textContent = "✅ " + data.msg;
      result.className = "ok";
      bodyEl.value = "";
      updateLineCount();
      startPolling();
    } else {
      result.textContent = "❌ " + data.msg;
      result.className = "ng";
    }
  } catch (err) {
    result.textContent = "❌ 通信エラー: " + err;
    result.className = "ng";
  } finally {
    btn.disabled = false;
    btn.textContent = "申請する";
  }
});

// --- 進捗ポーリング ---
function startPolling() {
  statusBox.classList.remove("hidden");
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollStatus, 2000);
  pollStatus();
}

async function pollStatus() {
  try {
    const res = await fetch("/status");
    const s = await res.json();

    const emoji = { idle: "⏸", running: "⏳", done: "✅", failed: "❌" }[s.status] || "❔";
    const modeLabel = { csv: "楽曲リスト", playlist: "プレイリスト" }[s.mode] || "";
    statusLine.textContent =
      `${emoji} ${s.status}  ${modeLabel ? "[" + modeLabel + "]" : ""}` +
      `${s.count ? "  " + s.count + " 件" : ""}` +
      `${s.started_at ? "  開始: " + s.started_at : ""}`;

    if (s.log_tail && s.log_tail.length) {
      statusLog.textContent = s.log_tail.join("\n");
      statusLog.scrollTop = statusLog.scrollHeight;
    }

    if (s.status === "done" || s.status === "failed") {
      clearInterval(pollTimer);
      pollTimer = null;
      if (s.status === "done") {
        statusLine.textContent += "  🎉 Navidromeで Quick scan してください";
      }
    }
  } catch (err) {
    // 次回ポーリングで回復
  }
}

updateLineCount();
</script>
</body>
</html>
